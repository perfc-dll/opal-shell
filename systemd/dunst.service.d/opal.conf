# Opal has its own notification daemon. Keep dunst (D-Bus activated) from
# grabbing org.freedesktop.Notifications while the Opal session is running;
# in the regular waybar session this check passes and dunst works as before.
[Service]
ExecCondition=/bin/sh -c 'case "$(systemctl --user show -p ActiveState --value niri-opal.service)" in active|activating|reloading) exit 1;; esac'

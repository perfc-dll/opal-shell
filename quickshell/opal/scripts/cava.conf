# cava config used by the Opal shell (raw ascii frames on stdout)
[general]
bars = 48
framerate = 30
sleep_timer = 2
lower_cutoff_freq = 40
higher_cutoff_freq = 12000

[input]
method = pulse
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10
channels = mono
mono_option = average

[smoothing]
noise_reduction = 70
monstercat = 1
